name: Bug report
description: Report a reproducible problem using a minimal, redacted example.
body:
  - type: textarea
    id: environment
    attributes:
      label: Versions and environment
      description: Project version/commit, Python version, OS, installation mode and relevant integrations.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Use a disposable example and dummy credentials. Follow SECURITY.md for vulnerabilities; exclude private code, media and personal data.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted logs or test evidence
