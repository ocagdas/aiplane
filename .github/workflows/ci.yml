name: CI

on:
  pull_request:
  push:
    branches: ['**']
  merge_group:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
    outputs:
      go:
        value: ${{ jobs.quality-gate.outputs.go }}

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.sha }}

      - name: Validate workflows with pinned actionlint
        shell: bash
        run: |
          curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck=''

      - name: Validate shared branch policy
        if: github.event_name == 'pull_request'
        env:
          SOURCE_BRANCH: ${{ github.head_ref }}
          TARGET_BRANCH: ${{ github.base_ref }}
          TRUNK: ${{ vars.REPOSITORY_TRUNK || 'main' }}
        run: python scripts/check_branch_policy.py --source "$SOURCE_BRANCH" --target "$TARGET_BRANCH" --trunk "$TRUNK"
      - name: Reject package-version changes in pull requests
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: |
          git fetch origin "$GITHUB_BASE_REF"
          python scripts/version.py check-pr --base-ref "origin/$GITHUB_BASE_REF"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dev dependencies
        run: python -m pip install -e ".[dev]"

      - name: Quality gate
        run: make check PYTEST_ARGS="-m pytest -q --junitxml=${{ runner.temp }}/junit.xml"

      - name: Upload test evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-tests
          path: ${{ runner.temp }}/junit.xml

  compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dev dependencies
        run: python -m pip install ".[dev]"

      - name: Validate supported Python and static wheel
        run: python -m pytest -q tests/test_contracts.py tests/test_packaging.py

  install-channels:
    name: Install channels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Install packaging tools
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: python -m pip install --no-input pipx setuptools==83.0.0

      - name: Build wheel artifact
        run: python -m pip wheel . --no-deps --no-build-isolation --wheel-dir dist

      - name: Validate real pip, pipx, and uv installed-wheel lifecycles
        run: python scripts/verify_install_channels.py dist

  quality-gate:
    name: Quality gate
    if: ${{ always() }}
    needs: [checks, compatibility, install-channels]
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.gate.outputs.go }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Evaluate every dependency
        id: gate
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          export GITHUB_SHA="$(git rev-parse HEAD)"
          python scripts/ci_gate.py --report "$RUNNER_TEMP/ci-gate.json"
      - name: Upload quality evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quality-gate
          path: ${{ runner.temp }}/ci-gate.json
          if-no-files-found: error

  version:
    needs: [quality-gate]
    if: ${{ vars.REPOSITORY_VERSIONING_ENABLED == 'true' && github.event_name == 'push' && github.workflow == 'CI' && github.ref_name == (vars.REPOSITORY_TRUNK || 'main') && needs.quality-gate.result == 'success' && needs.quality-gate.outputs.go == 'true' }}
    uses: ./.github/workflows/version.yml
    permissions:
      contents: read
      pull-requests: read
    with:
      source: ${{ github.sha }}
      trunk: ${{ vars.REPOSITORY_TRUNK || 'main' }}
      go: ${{ needs.quality-gate.outputs.go }}
    secrets: inherit
