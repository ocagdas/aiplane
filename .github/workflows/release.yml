name: Release artifacts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to publish, for example v0.1.0"
        required: true
        type: string

permissions:
  actions: write
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  classify:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.tag.outputs.publish }}
      tag: ${{ steps.tag.outputs.tag }}
      commit: ${{ steps.tag.outputs.source_commit }}
      change_kind: ${{ steps.tag.outputs.change_kind }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - id: tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: python scripts/version.py classify-release --tag "$TAG" --github-output

  qualification:
    needs: [classify]
    if: ${{ needs.classify.outputs.publish == 'true' || github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      pull-requests: read
    with:
      ref: ${{ needs.classify.outputs.commit }}

  release:
    needs: [classify, qualification]
    if: ${{ needs.qualification.result == 'success' && needs.qualification.outputs.go == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out qualified release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.classify.outputs.commit }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Install build and validation tools
        run: python -m pip install build pipx setuptools==83.0.0 -e ".[dev]"

      - name: Build wheel and source distribution
        env:
          TAG: ${{ needs.classify.outputs.tag }}
        run: python scripts/build_release.py --tag "$TAG" --output dist

      - name: Validate wheel through every install channel
        run: python scripts/verify_install_channels.py dist

      - name: Require complete release artifact set
        run: python scripts/verify_release_manifest.py dist

      - name: Attest release distributions
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS

      - name: Verify release build provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for artifact in dist/*.whl dist/*.tar.gz dist/provenance.json; do
            gh attestation verify "$artifact" --repo "$GITHUB_REPOSITORY"
          done

      - name: Write generated release notes
        run: |
          python scripts/render_release_notes.py \
            --tag "${{ needs.classify.outputs.tag }}" \
            --change-kind "${{ needs.classify.outputs.change_kind }}" \
            --commit "$(git rev-parse HEAD)" \
            --checksums dist/SHA256SUMS \
            --output RELEASE_NOTES.md

      - name: Publish GitHub Release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ needs.classify.outputs.tag }}" dist/* --title "aiplane ${{ needs.classify.outputs.tag }}" --notes-file RELEASE_NOTES.md --verify-tag

      - name: Verify published release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.classify.outputs.tag }}
        run: |
          gh release download "$TAG" --dir downloaded
          python scripts/build_release.py --verify-only --output downloaded
          cmp dist/SHA256SUMS downloaded/SHA256SUMS

      - name: Start public cross-platform verification
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.classify.outputs.tag }}
          TRUNK: ${{ vars.REPOSITORY_TRUNK || 'main' }}
        run: gh workflow run verify-release.yml --ref "$TRUNK" -f tag="$TAG"
